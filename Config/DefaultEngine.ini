[/Script/EngineSettings.GameMapsSettings]
; 仓库里没有 .umap：用引擎自带的空地图，场景全部由 AToyStudio 在运行时拼出来
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/VRToyBox.ToyBoxGameMode

[/Script/Engine.RendererSettings]
; VR 常用设置：前向渲染 + MSAA，关掉 Lumen / 虚拟阴影这类对帧率很贵的功能
r.ForwardShading=True
vr.InstancedStereo=True
vr.MobileMultiView=True
r.MSAACount=4
r.AntiAliasingMethod=3
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0
r.GenerateMeshDistanceFields=False
; 自动曝光用扩展亮度范围（新建项目模板默认就开）；不开的话室内灯光会被钳在旧的小范围里，画面严重过曝发白
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
